name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        env:
          VAULT_BACKEND: file
          VAULT_NO_GUI: "1"
        run: pytest -q

      - name: Smoke test the CLI
        env:
          VAULT_BACKEND: file
          VAULT_NO_GUI: "1"
          VAULT_LANG: en
        shell: bash
        run: |
          export VAULT_HOME="${RUNNER_TEMP}/vault-ci"
          echo "ci-secret-value-123" | vault set CI_TOKEN --stdin
          vault list
          vault doctor
          # the value must not appear in any of the agent-visible outputs
          vault list | grep -q CI_TOKEN
          ! vault list | grep -q ci-secret-value-123
          vault run CI_TOKEN -- python -c "import os;print(os.environ['CI_TOKEN'])" \
            | grep -q 'REDACTED:CI_TOKEN'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
